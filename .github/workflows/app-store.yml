name: App Store

# Sends an iOS release to App Review.
#
# release-please cuts every release as a GitHub pre-release, and the release
# workflow uploads its iOS build to TestFlight. Promoting a pre-release to a
# full release is the decision that it goes to the store, and that starts this
# workflow. Nothing is rebuilt: the `ios submit` lane waits for the version's
# TestFlight build to finish processing and attaches it.
#
# Once App Review approves the version, you publish it in App Store Connect.
#
# `workflow_dispatch` runs the same for any tag. `dry_run` (the default there)
# updates the version and its notes but does not submit.
#
# Uses the APP_STORE_CONNECT_API_KEY_* secrets the TestFlight job uses. The
# optional REVIEW_CONTACT_FIRST_NAME, REVIEW_CONTACT_LAST_NAME,
# REVIEW_CONTACT_PHONE and REVIEW_CONTACT_EMAIL set the App Review contact, and
# REVIEW_DEMO_URL, REVIEW_DEMO_USER and REVIEW_DEMO_PASSWORD the demo server App
# Review signs in to. Without them App Store Connect keeps what it has.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v0.1.166).
        required: true
      dry_run:
        description: Update the version and its notes, but do not submit.
        type: boolean
        default: true

# Two submissions must not race: one pulls the other's version back.
concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit to App Review
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')) }}
    runs-on: macos-26
    # The build may still be processing when a release is promoted.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # Nothing is built from the checkout; the version comes from TAG.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          raw="$RUNNER_TEMP/release_notes_raw.md"
          file="$RUNNER_TEMP/release_notes.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$raw" || : > "$raw"
          # Notes must never block a submission: without them App Store
          # Connect keeps the version's current "What's New".
          python3 ../scripts/plain_release_notes.py < "$raw" > "$file" || : > "$file"
          echo "RELEASE_NOTES_FILE=$file" >> "$GITHUB_ENV"

      - name: Submit to App Review
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: "true"
          REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
          REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
          REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
          REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
          REVIEW_DEMO_URL: ${{ secrets.REVIEW_DEMO_URL }}
          REVIEW_DEMO_USER: ${{ secrets.REVIEW_DEMO_USER }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          FASTLANE_HIDE_CHANGELOG: "true"
        run: bundle exec fastlane ios submit version:"${TAG#v}" dry_run:"${DRY_RUN:-false}"
