name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # "Analyze & Test" is a required check, so the job always runs and reports
  # success; a workflow-level `paths:` filter would leave it pending forever on
  # PRs that do not touch Flutter. The expensive steps and the macOS/iOS jobs
  # are gated on the filter output instead.
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect Flutter-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            flutter:
              - 'app/**'
              - 'openapi.json'
              - '.github/workflows/flutter.yml'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.filter.outputs.flutter == 'true'
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Install dependencies
        if: steps.filter.outputs.flutter == 'true'
        run: flutter pub get

      - name: Analyze (zero issues)
        if: steps.filter.outputs.flutter == 'true'
        run: flutter analyze --fatal-infos

      - name: Run tests
        if: steps.filter.outputs.flutter == 'true'
        run: flutter test

  build-macos-bundle:
    name: Build macOS Bundle (no-codesign)
    runs-on: macos-26
    needs: analyze-and-test
    if: needs.analyze-and-test.outputs.flutter == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Disable code signing
        run: |
          cat >> app/macos/Runner/Configs/AppInfo.xcconfig <<'EOF'
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGN_IDENTITY =
          EOF

          # The ShareExtension target has its own build settings in the Xcode
          # project and does not inherit from the Runner xcconfig files.
          # Patch project.pbxproj to disable signing for all targets.
          PBXPROJ=app/macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = WPW3QSLZ2F/DEVELOPMENT_TEAM = ""/g' "$PBXPROJ"

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "flutter-macos"

      - name: Build macOS bundle
        run: make build-macos-bundle

  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-26
    needs: analyze-and-test
    if: needs.analyze-and-test.outputs.flutter == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release
