name: Flutter

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # On PRs: single-arch debug build to verify compilation quickly (~5 min).
  # On main: full universal release build + flutter build macos (~25 min).
  build-macos-bundle:
    name: Build macOS Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          if [ "${{ github.event_name }}" = "push" ]; then
            rustup target add x86_64-apple-darwin
          fi

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ github.event_name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-${{ github.event_name }}-
            ${{ runner.os }}-cargo-macos-

      - name: Build macOS bundle (PR — single arch, debug)
        if: github.event_name == 'pull_request'
        run: cargo build -p assistant-cli --target aarch64-apple-darwin

      - name: Build macOS bundle (main — universal release)
        if: github.event_name == 'push'
        run: make build-macos-bundle
