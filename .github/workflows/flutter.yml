name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build-macos-bundle:
    name: Build macOS Bundle (no-codesign)
    runs-on: macos-26
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Disable code signing
        run: |
          cat >> app/macos/Runner/Configs/AppInfo.xcconfig <<'EOF'
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGN_IDENTITY =
          EOF

          # The ShareExtension target has its own build settings in the Xcode
          # project and does not inherit from the Runner xcconfig files.
          # Patch project.pbxproj to disable signing for all targets.
          PBXPROJ=app/macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = ""/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = WPW3QSLZ2F/DEVELOPMENT_TEAM = ""/g' "$PBXPROJ"

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "flutter-macos"

      - name: Build macOS bundle
        run: make build-macos-bundle

  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-26
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release
