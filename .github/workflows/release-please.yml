name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-flutter-web:
    name: Build Flutter web
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: app

      - name: Build Flutter web
        run: flutter build web --release
        working-directory: app

      - name: Upload Flutter web artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web-build
          path: app/build/web/
          retention-days: 1

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [release-please, build-flutter-web]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
            archive_suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            use_cross: false
            archive_suffix: linux-aarch64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            archive_suffix: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            archive_suffix: linux-aarch64-musl

    steps:
      - uses: actions/checkout@v6

      - name: Download Flutter web build
        uses: actions/download-artifact@v8
        with:
          name: flutter-web-build
          path: app/build/web/

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install mold linker
        if: ${{ !matrix.use_cross && runner.os == 'Linux' }}
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Preflight check assistant-cli bin
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo check -p assistant-cli --all-features --bin assistant

      - name: Build assistant-cli (unified binary)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p assistant-cli
          else
            cargo build --release --target ${{ matrix.target }} -p assistant-cli
          fi

      - name: Validate assistant runtime subcommands
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          target/${{ matrix.target }}/release/assistant --help
          target/${{ matrix.target }}/release/assistant orchestrator run --help
          target/${{ matrix.target }}/release/assistant worker --help
          target/${{ matrix.target }}/release/assistant webui serve --help
          target/${{ matrix.target }}/release/assistant signal --help

      - name: Create archive
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ARCHIVE="assistant-${TAG}-${{ matrix.archive_suffix }}"
          mkdir -p "${ARCHIVE}"

          # Copy unified binary (Slack, Mattermost, MCP are subcommands of `assistant`)
          cp "target/${{ matrix.target }}/release/assistant" "${ARCHIVE}/" || \
            cp "target/${{ matrix.target }}/release/assistant.exe" "${ARCHIVE}/" 2>/dev/null || true

          # Copy config template
          cp config.toml "${ARCHIVE}/config.toml.example"

          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.archive_suffix }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ env.ARCHIVE }}

  build-flutter-desktop:
    name: Build Flutter desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            flutter_target: macos
            archive_suffix: macos-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: app

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin

      - name: Install protoc (macOS)
        run: brew install protobuf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-macos-bundle"

      - name: Import certificates
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEV_CERTIFICATE: ${{ secrets.APPLE_DEV_CERTIFICATE }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Developer ID Application cert (for codesign + notarization)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Apple Development cert (required by flutter build macos with keychain-access-groups)
          echo -n "$APPLE_DEV_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/dev-certificate.p12
          security import "$RUNNER_TEMP/dev-certificate.p12" -P "" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build universal Rust binary for macOS bundle
        run: make build-macos-binary

      # Package and upload the standalone CLI tarball early, so that a later
      # Flutter/notarization failure does not block this artifact.
      - name: Create standalone macOS tarball
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          STANDALONE="assistant-${TAG}-macos-arm64"
          mkdir -p "${STANDALONE}"
          cp target/aarch64-apple-darwin/release/assistant "${STANDALONE}/"
          cp config.toml "${STANDALONE}/config.toml.example"
          tar czf "${STANDALONE}.tar.gz" "${STANDALONE}"
          echo "STANDALONE_ARCHIVE=${STANDALONE}.tar.gz" >> $GITHUB_ENV

      - name: Upload standalone binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-macos-arm64
          path: ${{ env.STANDALONE_ARCHIVE }}
          retention-days: 1

      - name: Upload standalone macOS tarball to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ env.STANDALONE_ARCHIVE }}

      - name: Build Flutter macOS app
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          flutter build macos --release --build-name "${VERSION}"
        working-directory: app

      - name: Sign macOS app
        run: |
          APP="app/build/macos/Build/Products/Release/assistant_app.app"
          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          # Bottom-up signing: embedded binaries and frameworks first, then the bundle
          # Sign the embedded Rust binary (notarization requires all binaries to have hardened runtime + timestamp)
          find "$APP/Contents/Resources" -type f -perm +111 2>/dev/null | while read f; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$f"
          done
          find "$APP/Contents/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) 2>/dev/null | while read f; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$f"
          done
          codesign --force --sign "$IDENTITY" --options runtime --timestamp \
            --entitlements app/macos/Runner/Release.entitlements "$APP"

      - name: Verify code signature
        run: |
          APP="app/build/macos/Build/Products/Release/assistant_app.app"
          codesign --verify --deep --strict "$APP"
          echo "Code signature verification passed"

      - name: Notarize macOS app
        run: |
          APP="app/build/macos/Build/Products/Release/assistant_app.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/assistant_app_notarize.zip"
          SUBMISSION=$(xcrun notarytool submit "$RUNNER_TEMP/assistant_app_notarize.zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --output-format json)
          SUBMISSION_ID=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Notarization submission ID: $SUBMISSION_ID"
          # Poll until complete
          while true; do
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Accepted" ]; then break; fi
            if [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "${{ secrets.APPLE_ID }}" \
                --password "${{ secrets.APPLE_APP_PASSWORD }}" \
                --team-id "${{ secrets.APPLE_TEAM_ID }}"
              exit 1
            fi
            sleep 15
          done
          xcrun stapler staple "$APP"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Create ZIP archive
        shell: bash
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ARCHIVE_NAME="assistant-app-${TAG}-${{ matrix.archive_suffix }}.zip"
          # Use ditto instead of zip to preserve macOS framework symlinks.
          # zip -r follows symlinks, turning them into real files, which breaks
          # the framework bundle structure and causes Gatekeeper to reject the
          # app with "bundle format is ambiguous (could be app or framework)".
          ditto -c -k --keepParent \
            "app/build/macos/Build/Products/Release/assistant_app.app" \
            "${ARCHIVE_NAME}"
          echo "ARCHIVE=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Generate checksums
        shell: bash
        run: |
          shasum -a 256 "${{ env.ARCHIVE }}" > checksums.sha256
          cat checksums.sha256

      - name: Upload ZIP to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            "${{ env.ARCHIVE }}" checksums.sha256

  release-ios-testflight:
    name: Build & Upload iOS to TestFlight
    runs-on: macos-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}

    defaults:
      run:
        working-directory: app

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      APP_STORE_CONNECT_API_KEY_IS_BASE64: "true"
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_READONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up SSH for match repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Validate required secrets
        run: |
          missing=()
          [ -z "$APP_STORE_CONNECT_API_KEY_KEY_ID" ]    && missing+=("APP_STORE_CONNECT_API_KEY_KEY_ID")
          [ -z "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ] && missing+=("APP_STORE_CONNECT_API_KEY_ISSUER_ID")
          [ -z "$APP_STORE_CONNECT_API_KEY_KEY" ]       && missing+=("APP_STORE_CONNECT_API_KEY_KEY")
          [ -z "$MATCH_GIT_URL" ]                        && missing+=("MATCH_GIT_URL")
          [ -z "$MATCH_PASSWORD" ]                       && missing+=("MATCH_PASSWORD")
          [ -z "${{ secrets.MATCH_DEPLOY_KEY }}" ]        && missing+=("MATCH_DEPLOY_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "ERROR: The following required secrets are not set:"
            for v in "${missing[@]}"; do echo "  - $v"; done
            echo "See app/fastlane/README.md for setup instructions."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      - name: Reinstall CocoaPods
        run: gem install cocoapods
        working-directory: app

      - name: Run Fastlane beta lane
        run: bundle exec fastlane ios beta

  build-docker:
    name: Build and push Docker image (Alpine)
    runs-on: ubuntu-latest
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Download Linux x86_64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-x86_64-musl
          path: ./dist/x86_64-musl

      - name: Download Linux aarch64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-aarch64-musl
          path: ./dist/aarch64-musl

      - name: Stage binaries for Docker build context
        run: |
          set -euo pipefail
          mkdir -p docker-context/bin/amd64 docker-context/bin/arm64

          cd dist/x86_64-musl
          tar xzf "$(ls *.tar.gz | head -1)"
          cp */assistant ../../docker-context/bin/amd64/assistant
          cd ../..

          cd dist/aarch64-musl
          tar xzf "$(ls *.tar.gz | head -1)"
          cp */assistant ../../docker-context/bin/arm64/assistant
          cd ../..

          cp config.toml docker-context/config.toml
          cp docker/Dockerfile.assistant-alpine docker-context/Dockerfile
          chmod +x docker-context/bin/amd64/assistant docker-context/bin/arm64/assistant

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cedricziel/assistant/assistant
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Alpine image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-packages:
    name: Build OS packages (Linux x86_64 + aarch64)
    runs-on: ubuntu-latest
    needs: [release-please, build-binaries]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}

    steps:
      - uses: actions/checkout@v6

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-x86_64
          path: ./dist/x86_64

      - name: Download Linux aarch64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-aarch64
          path: ./dist/aarch64

      - name: Download Linux x86_64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-x86_64-musl
          path: ./dist/x86_64-musl

      - name: Download Linux aarch64 musl binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-aarch64-musl
          path: ./dist/aarch64-musl

      - name: Extract binaries
        run: |
          cd dist/x86_64
          ARCHIVE=$(ls *.tar.gz | head -1)
          tar xzf "${ARCHIVE}"
          echo "BIN_DIR_X86=dist/x86_64/${ARCHIVE%.tar.gz}" >> $GITHUB_ENV

          cd ../aarch64
          ARCHIVE=$(ls *.tar.gz | head -1)
          tar xzf "${ARCHIVE}"
          echo "BIN_DIR_ARM64=dist/aarch64/${ARCHIVE%.tar.gz}" >> $GITHUB_ENV

          cd ../x86_64-musl
          ARCHIVE=$(ls *.tar.gz | head -1)
          tar xzf "${ARCHIVE}"
          echo "BIN_DIR_X86_MUSL=dist/x86_64-musl/${ARCHIVE%.tar.gz}" >> $GITHUB_ENV

          cd ../aarch64-musl
          ARCHIVE=$(ls *.tar.gz | head -1)
          tar xzf "${ARCHIVE}"
          echo "BIN_DIR_ARM64_MUSL=dist/aarch64-musl/${ARCHIVE%.tar.gz}" >> $GITHUB_ENV

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt update
          sudo apt install -y nfpm

      - name: Build x86_64 packages
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          sed \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|g" \
            -e "s|BIN_DIR_PLACEHOLDER|${BIN_DIR_X86}|g" \
            -e "s|ARCH_PLACEHOLDER|amd64|g" \
            packaging/nfpm-assistant.yaml.tpl > nfpm-amd64.yaml
          nfpm package --config nfpm-amd64.yaml --packager deb --target ./dist/
          nfpm package --config nfpm-amd64.yaml --packager rpm --target ./dist/

      - name: Build arm64 packages
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          sed \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|g" \
            -e "s|BIN_DIR_PLACEHOLDER|${BIN_DIR_ARM64}|g" \
            -e "s|ARCH_PLACEHOLDER|arm64|g" \
            packaging/nfpm-assistant.yaml.tpl > nfpm-arm64.yaml
          nfpm package --config nfpm-arm64.yaml --packager deb --target ./dist/
          nfpm package --config nfpm-arm64.yaml --packager rpm --target ./dist/

      - name: Build x86_64 APK package (musl)
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist/apk/x86_64
          sed \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|g" \
            -e "s|BIN_DIR_PLACEHOLDER|${BIN_DIR_X86_MUSL}|g" \
            -e "s|ARCH_PLACEHOLDER|amd64|g" \
            packaging/nfpm-assistant-apk.yaml.tpl > nfpm-apk-amd64.yaml
          nfpm package --config nfpm-apk-amd64.yaml --packager apk --target ./dist/apk/x86_64/

      - name: Build arm64 APK package (musl)
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist/apk/aarch64
          sed \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|g" \
            -e "s|BIN_DIR_PLACEHOLDER|${BIN_DIR_ARM64_MUSL}|g" \
            -e "s|ARCH_PLACEHOLDER|arm64|g" \
            packaging/nfpm-assistant-apk.yaml.tpl > nfpm-apk-arm64.yaml
          nfpm package --config nfpm-apk-arm64.yaml --packager apk --target ./dist/apk/aarch64/

      - name: Upload packages to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} dist/*.deb dist/*.rpm
          gh release upload ${{ needs.release-please.outputs.tag_name }} dist/apk/x86_64/*.apk dist/apk/aarch64/*.apk

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 1

      - name: Upload APK packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-apk
          path: dist/apk/
          retention-days: 1

  publish-repo:
    name: Publish APT/YUM/APK repo to GitHub Pages
    runs-on: ubuntu-latest
    needs: [release-please, build-packages]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install repo tools
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev createrepo-c

      - name: Download packages artifact
        uses: actions/download-artifact@v8
        with:
          name: packages-linux
          path: ./new-packages

      - name: Download APK packages artifact
        uses: actions/download-artifact@v8
        with:
          name: packages-apk
          path: ./new-packages-apk

      - name: Bootstrap gh-pages branch (first run only)
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git switch --orphan gh-pages
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: initialise package repository"
            git push origin gh-pages
            git switch -
          fi

      - name: Check out gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add .deb packages and regenerate APT index
        run: |
          mkdir -p repo/apt
          rm -f repo/apt/*.deb
          cp new-packages/*.deb repo/apt/
          cd repo/apt
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages

      - name: Add .rpm packages and regenerate YUM index
        run: |
          mkdir -p repo/rpm
          rm -f repo/rpm/*.rpm
          cp new-packages/*.rpm repo/rpm/
          rm -rf repo/rpm/repodata
          createrepo_c repo/rpm/

      - name: Add Alpine APK packages and regenerate APKINDEX
        run: |
          for ARCH in x86_64 aarch64; do
            mkdir -p repo/apk/${ARCH}
            rm -f repo/apk/${ARCH}/*.apk repo/apk/${ARCH}/APKINDEX.tar.gz
            if ls new-packages-apk/${ARCH}/*.apk 1>/dev/null 2>&1; then
              cp new-packages-apk/${ARCH}/*.apk repo/apk/${ARCH}/
            fi
            docker run --rm \
              -v "$(pwd)/repo/apk/${ARCH}:/apkdir" \
              alpine:latest \
              sh -c "apk add --no-cache apk-tools && cd /apkdir && apk index --allow-untrusted --output APKINDEX.tar.gz *.apk"
          done

      - name: Ensure .nojekyll
        run: touch repo/.nojekyll

      - name: Write install-instructions page
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          cat > repo/index.html << 'HTMLDOC'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>assistant – package repository</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
              pre  { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: .9rem; }
              h2   { margin-top: 2rem; border-bottom: 1px solid #e0e0e0; padding-bottom: .4rem; }
              a    { color: #0066cc; }
            </style>
          </head>
          <body>
            <h1>assistant</h1>
            <p>Local self-improving AI assistant. Latest: <strong>TAG_PLACEHOLDER</strong></p>

            <h2>APT &ndash; Debian / Ubuntu</h2>
            <pre>echo "deb [trusted=yes] https://cedricziel.github.io/assistant/apt ./" | sudo tee /etc/apt/sources.list.d/assistant.list
          sudo apt update &amp;&amp; sudo apt install assistant</pre>

            <h2>YUM / DNF &ndash; Fedora / RHEL / Rocky</h2>
            <pre>sudo tee /etc/yum.repos.d/assistant.repo &lt;&lt; 'EOF'
          [assistant]
          name=assistant
          baseurl=https://cedricziel.github.io/assistant/rpm/
          enabled=1
          gpgcheck=0
          EOF
          sudo dnf install assistant</pre>

            <h2>APK &ndash; Alpine Linux</h2>
            <pre>echo "https://cedricziel.github.io/assistant/apk" | sudo tee -a /etc/apk/repositories
          sudo apk update
          sudo apk add --allow-untrusted assistant</pre>

            <h2>Tarball</h2>
            <p>Pre-built tarballs for Linux (x86_64, aarch64) and macOS (arm64) are available on the
              <a href="https://github.com/cedricziel/assistant/releases">GitHub Releases</a> page.</p>
          </body>
          </html>
          HTMLDOC
          sed -i "s/TAG_PLACEHOLDER/${TAG}/" repo/index.html

      - name: Commit and force-push (single orphan commit keeps branch small)
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp-pages
          git add -A
          git commit -m "chore: update package repo for ${{ needs.release-please.outputs.tag_name }}"
          git push --force-with-lease origin tmp-pages:gh-pages
