name: Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Lean Alpine image built from source using musl targets via cross.
  # For release builds the image is also produced by the release-please workflow
  # from pre-built artifacts (faster). This workflow exists for manual / dev
  # tag builds where release-please artifacts are not available.
  build-assistant:
    name: Build assistant image (Alpine, from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "docker-musl"

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      - name: Vendor JS dependencies
        run: make vendor

      - name: Build x86_64 musl binary
        run: cross build --release --target x86_64-unknown-linux-musl -p assistant-cli

      - name: Build aarch64 musl binary
        run: cross build --release --target aarch64-unknown-linux-musl -p assistant-cli

      - name: Stage binaries for Docker build context
        run: |
          mkdir -p docker-context/bin/amd64 docker-context/bin/arm64
          cp target/x86_64-unknown-linux-musl/release/assistant docker-context/bin/amd64/assistant
          cp target/aarch64-unknown-linux-musl/release/assistant docker-context/bin/arm64/assistant
          cp config.toml docker-context/config.toml
          cp docker/Dockerfile.assistant-alpine docker-context/Dockerfile
          chmod +x docker-context/bin/amd64/assistant docker-context/bin/arm64/assistant

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cedricziel/assistant/assistant
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
