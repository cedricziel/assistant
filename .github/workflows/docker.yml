name: Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Lean Alpine image built from source using musl targets via cross.
  # For release builds the image is also produced by the release-please workflow
  # from pre-built artifacts (faster). This workflow exists for manual / dev
  # tag builds where release-please artifacts are not available.
  build-assistant:
    name: Build assistant image (Alpine, from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: app

      - name: Build Flutter web
        run: flutter build web --release
        working-directory: app

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "docker-musl"

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get install -y protobuf-compiler

      - name: Build x86_64 musl binary
        run: cross build --release --target x86_64-unknown-linux-musl -p assistant-cli

      - name: Build aarch64 musl binary
        run: cross build --release --target aarch64-unknown-linux-musl -p assistant-cli

      - name: Validate x86_64 musl binary
        run: target/x86_64-unknown-linux-musl/release/assistant --version

      - name: Stage binaries for Docker build context
        run: |
          set -euo pipefail
          mkdir -p docker-context/bin/amd64 docker-context/bin/arm64
          cp target/x86_64-unknown-linux-musl/release/assistant docker-context/bin/amd64/assistant
          cp target/aarch64-unknown-linux-musl/release/assistant docker-context/bin/arm64/assistant
          cp server.toml org.toml docker-context/
          cp docker/Dockerfile.assistant-alpine docker-context/Dockerfile
          chmod +x docker-context/bin/amd64/assistant docker-context/bin/arm64/assistant

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/cedricziel/assistant/assistant
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
