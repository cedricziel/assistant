[package]
name = "assistant"
version = "0.1.62"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
members = [
    "crates/core",
    "crates/skills",
    "crates/llm",
    "crates/provider-ollama",
    "crates/provider-anthropic",
    "crates/provider-openai",
    "crates/provider-moonshot",
    "crates/storage",
    "crates/workflow",
    "crates/workflow-http",
    "crates/runtime",
    "crates/tool-executor",
    "crates/mcp-client",
    "crates/mcp-server",
    "crates/interface-cli",
    "crates/interface-signal",
    "crates/interface-slack",
    "crates/interface-mattermost",
    "crates/interface-matrix",
    "crates/interface-nextcloud",
    "crates/transcription",
    "crates/integration-tests",
    "crates/web-ui",
    "crates/a2a-json-schema",
    "crates/opentelemetry-exporter-sqlite",
    "crates/bus-nats",
]
default-members = [
    "crates/interface-cli",
    "crates/interface-signal",
    "crates/interface-slack",
    "crates/interface-mattermost",
    "crates/interface-nextcloud",
    "crates/web-ui",
    "crates/mcp-server",
]
resolver = "2"

[workspace.package]
version = "0.1.62"
edition = "2021"
license = "MIT"
repository = "https://github.com/cedricziel/assistant"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-util = "0.7"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1.0"
# Async traits
async-trait = "0.1"
# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Encoding
base64 = "0.22"
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.8"
reqwest-tracing = "0.5"
# OpenAI-compatible client (used by provider-openai and provider-moonshot)
async-openai = { version = "0.33", features = ["chat-completion", "embedding", "responses"] }
# TLS — explicit dep so binaries can install_default() when both aws-lc-rs and ring are in tree
rustls = { version = "0.23", features = ["ring"] }
# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.31", features = ["trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "tls-roots", "trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "logs", "metrics", "rt-tokio"] }
opentelemetry-appender-tracing = "0.31"
opentelemetry-semantic-conventions = { version = "0.31", features = ["semconv_experimental"] }
# CLI / config
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
toml = "1.0"
# HTTP server
axum = { version = "0.8", features = ["macros"] }
# Async streams
futures = "0.3"
# Terminal line editor
reedline = "0.46"
# QR code terminal rendering
qr2term = "0.3"
# YAML frontmatter parser
gray_matter = "0.3"
# YAML serialization (for writing agent card frontmatter)
serde_yaml = "0.9"
# Embed static file trees into the binary at compile time
include_dir = "0.7"
# Type-safe compiled templates
askama = "0.15"
# SQL persistence
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "chrono", "uuid"] }
# cron expression parsing
cron = "0.15"
# HTML parsing for web-fetch builtin
scraper = "0.25"
# Glob pattern matching for file-glob builtin
glob = "0.3"
# JSON Schema validation for tool param checking
jsonschema = "0.45"
# SHA-256 hashing for memory chunk change detection
sha2 = "0.10"
# Natural language processing for memory search
whatlang = "0.18"
stop-words = "0.10"
# HMAC message authentication (webhook signature verification)
hmac = "0.12"
# Hex encoding
hex = "0.4"
# URL parsing
url = "2"
# OS-level CSPRNG
getrandom = "0.4"
# NATS message bus
async-nats = "0.46"
# Integration testing
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["nats"] }
wiremock = "0.6"
tempfile = "3"
# LRU cache (bounded conversation map in Mattermost/Slack runners)
lru = "0.16"
# Matrix interface
matrix-sdk = { version = "0.10", features = ["sqlite", "rustls-tls"], default-features = false }
# Slack / Mattermost interfaces
slack-morphism = { version = "2", features = ["hyper"] }
# Force rustls TLS on the same tokio-tungstenite major/minor used by
# slack-morphism so wss:// support is actually enabled in the Slack client.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
mattermost_api = "0.8"
# Internal crates
opentelemetry-exporter-sqlite = { path = "crates/opentelemetry-exporter-sqlite" }
core = { path = "crates/core" }
skills = { path = "crates/skills" }
llm = { path = "crates/llm" }
storage = { path = "crates/storage" }
runtime = { path = "crates/runtime" }
tool-executor = { path = "crates/tool-executor" }

# Force all crates to use the same curve25519-dalek as libsignal/presage.
# Without this patch, two versions coexist (crates.io 4.1.3 vs signalapp git fork
# 4.1.3), causing type-mismatch errors when building with --features signal.
# The signalapp fork is API-compatible; the patch is a no-op for non-signal builds.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
