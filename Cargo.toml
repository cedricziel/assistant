[package]
name = "assistant"
version = "0.1.118"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[workspace]
members = [
    "crates/core",
    "crates/skills",
    "crates/llm",
    "crates/provider-ollama",
    "crates/provider-anthropic",
    "crates/provider-openai",
    "crates/provider-moonshot",
    "crates/storage",
    "crates/workflow",
    "crates/workflow-http",
    "crates/runtime",
    "crates/tool-executor",
    "crates/mcp-client",
    "crates/mcp-server",
    "crates/interface-cli",
    "crates/interface-signal",
    "crates/interface-slack",
    "crates/interface-mattermost",
    "crates/interface-matrix",
    "crates/interface-nextcloud",
    "crates/transcription",
    "crates/integration-tests",
    "crates/web-ui",
    "crates/a2a-json-schema",
    "crates/opentelemetry-exporter-sqlite",
    "crates/opentelemetry-exporter-iceberg",
    "crates/bus-nats",
    "crates/backup",
]
default-members = [
    "crates/interface-cli",
    "crates/interface-signal",
    "crates/interface-slack",
    "crates/interface-mattermost",
    "crates/interface-nextcloud",
    "crates/web-ui",
    "crates/mcp-server",
]
resolver = "2"

[workspace.package]
version = "0.1.118"
edition = "2024"
license = "MIT"
repository = "https://github.com/cedricziel/assistant"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1.0"
# Async traits
async-trait = "0.1"
# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Encoding
base64 = "0.22"
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"], default-features = false }
# Force vendored OpenSSL for static linking when cross-compiling (e.g. musl targets).
# openssl-sys builds from source rather than requiring a system installation.
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.8"
reqwest-tracing = "0.5"
# OpenAI-compatible client (used by provider-openai and provider-moonshot)
async-openai = { version = "0.34", features = ["chat-completion", "embedding", "responses"] }
# TLS — explicit dep so binaries can install_default() when both aws-lc-rs and ring are in tree
rustls = { version = "0.23", features = ["ring"] }
# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.31", features = ["trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-json", "reqwest-client", "trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "logs", "metrics", "rt-tokio"] }
opentelemetry-appender-tracing = "0.31"
opentelemetry-semantic-conventions = { version = "0.31", features = ["semconv_experimental"] }
# CLI / config
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
toml = "1.1"
# HTTP server
axum = { version = "0.8", features = ["macros", "multipart"] }
# Async streams
futures = "0.3"
# Terminal line editor
reedline = "0.47"
# YAML frontmatter parser
gray_matter = "0.3"
# YAML serialization (for writing agent card frontmatter)
serde_yaml = "0.9"
# Embed static file trees into the binary at compile time
include_dir = "0.7"
# Embed files/directories into the binary via proc-macro (used for Flutter web assets)
rust-embed = "8"
# MIME type detection from file extension
mime_guess = "2"
# Type-safe compiled templates
askama = "0.15"
# SQL persistence
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "chrono", "uuid"] }
# cron expression parsing
cron = "0.16"
# HTML parsing for web-fetch builtin
scraper = { version = "0.26", default-features = false }
# Glob pattern matching for file-glob builtin
glob = "0.3"
# Image decoding, encoding, and resizing (attachment serving)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# JSON Schema validation for tool param checking
jsonschema = { version = "0.45", default-features = false }
# SHA-256 hashing for memory chunk change detection
sha2 = "0.11"
# tar archive creation/extraction
tar = "0.4"
# gzip compression
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# Natural language processing for memory search
whatlang = "0.18"
stop-words = "0.10"
# HMAC message authentication (webhook signature verification)
hmac = "0.13"
# Hex encoding
hex = "0.4"
# URL parsing
url = "2"
# OS-level CSPRNG
getrandom = "0.4"
# VAPID-signed Web Push dispatch
# P-256 elliptic curve (for VAPID key generation)
p256 = { version = "0.13", features = ["arithmetic", "ecdh"] }
aes-gcm = "0.10"
hkdf = "0.13"
# Lossless TOML editing (preserves comments and whitespace)
toml_edit = "0.25"
# NATS message bus
async-nats = "0.47"
# Integration testing
testcontainers = "0.27"
# OpenAPI spec generation
utoipa = { version = "5.4", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
testcontainers-modules = { version = "0.15", features = ["nats"] }
wiremock = "0.6"
tempfile = "3"
# LRU cache (bounded conversation map in ChannelRunner)
lru = "0.16"
# WebSocket client (used by Slack, Mattermost, Matrix, Signal adapters)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# HTTP middleware / testing utilities
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
http-body-util = "0.1"
# URL percent-encoding
urlencoding = "2"
# Apache Iceberg
iceberg = "0.9"
iceberg-catalog-rest = "0.9"
arrow-array = "57.1"
arrow-schema = "57.1"
parquet = { version = "57.1", default-features = false, features = ["arrow", "async"] }
# Internal crates
opentelemetry-exporter-sqlite = { path = "crates/opentelemetry-exporter-sqlite" }
opentelemetry-exporter-iceberg = { path = "crates/opentelemetry-exporter-iceberg" }
core = { path = "crates/core" }
skills = { path = "crates/skills" }
llm = { path = "crates/llm" }
storage = { path = "crates/storage" }
runtime = { path = "crates/runtime" }
tool-executor = { path = "crates/tool-executor" }

[profile.dev]
# macOS: avoid dsymutil bottleneck at link time
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Compile third-party deps at opt-level 1; dramatically speeds up first build
# of heavy crates (arrow, parquet, iceberg, tonic) without hurting iteration speed
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# Strip debug symbols to reduce binary size and link time
strip = "symbols"
