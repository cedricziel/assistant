[package]
name = "assistant-interface-matrix"
version = "0.1.77"
edition.workspace = true
license.workspace = true
description = "Matrix interface for the AI assistant (library)"

[lib]
name = "assistant_interface_matrix"
path = "src/lib.rs"

[dependencies]
assistant-core = { path = "../core" }
assistant-runtime = { path = "../runtime" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
matrix-sdk = { workspace = true }
dirs = { workspace = true }
# Force bundled-sqlcipher-vendored-openssl so libsqlite3-sys can find OpenSSL
# headers when cross-compiling to musl targets (see workspace Cargo.toml comment).
rusqlite = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
