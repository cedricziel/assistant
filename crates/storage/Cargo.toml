[package]
name = "assistant-storage"
version = "0.1.164"
license.workspace = true
edition.workspace = true
description = "SQLite-backed storage layer: skill registry, traces, memory, and scheduled tasks"

[dependencies]
assistant-core = { path = "../core" }
assistant-skills = { path = "../skills" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
cron = { workspace = true }

[dev-dependencies]
# Auth and backup are dev-only — the migration round-trip test composes the
# external bootstrap and backup helpers to mirror the production caller.
# Production code in this crate must NOT depend on either.
assistant-auth = { path = "../auth" }
assistant-backup = { path = "../backup" }
tokio = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

# Storage is panic-free by contract: all production paths propagate errors
# via `Result<_, anyhow::Error>` or domain-typed errors. Tests are exempt
# because `make lint` (`cargo clippy --workspace`) does not check `#[cfg(test)]`
# modules.
#
# Cargo forbids combining `[lints] workspace = true` with per-crate overrides,
# so this crate manually replays the workspace baseline and raises the
# panic-free lints to deny. Keep this block in sync with the workspace
# baseline in the root Cargo.toml.
# See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
