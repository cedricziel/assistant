[package]
name = "assistant-web-ui"
version = "0.1.164"
edition.workspace = true
license.workspace = true
description = "Web-based trace analysis UI and A2A protocol server for the assistant"
autobins = false

[features]
default = ["nats"]
nats = ["dep:assistant-bus-nats"]

[dependencies]
assistant-bus-nats = { path = "../bus-nats", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
assistant-a2a-json-schema = { path = "../a2a-json-schema", features = ["utoipa"] }
assistant-auth = { path = "../auth" }
assistant-backup = { path = "../backup" }
assistant-core = { path = "../core" }
assistant-llm-provider = { path = "../llm-provider" }
assistant-runtime = { path = "../runtime" }
assistant-workflow = { path = "../workflow" }
assistant-workflow-http = { path = "../workflow-http" }
assistant-skills = { path = "../skills" }
assistant-storage = { path = "../storage" }
assistant-tool-executor = { path = "../tool-executor" }
assistant-mcp-client = { path = "../mcp-client" }
assistant-transcription = { path = "../transcription" }
axum = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros"] }
uuid = { workspace = true }
dirs = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
getrandom = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
toml_edit = { workspace = true }
p256 = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
arrow-array = { workspace = true }
parquet = { workspace = true }
iceberg = { workspace = true }
urlencoding.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
http-body-util = { workspace = true }
wiremock = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }

# Panic-free contract: all non-test code in this crate (and its sub-modules)
# propagates errors via `Result<_, anyhow::Error>` or returns an HTTP error
# response. The build script (`build.rs`) is exempt via its own per-file
# `#![allow(...)]` block since panicking is the correct error signal for a
# failed compile-time prerequisite. Cargo forbids combining `workspace = true`
# with per-crate overrides, so this manually replays the workspace baseline
# plus the deny ratchet. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
