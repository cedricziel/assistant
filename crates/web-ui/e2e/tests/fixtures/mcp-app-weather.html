<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        font: 14px system-ui, sans-serif;
        background: #10223a;
        color: #e8f0ff;
      }
      .card {
        padding: 16px;
      }
      .temp {
        font-size: 32px;
        font-weight: 600;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="city">Loading…</div>
      <div class="temp" id="temp"></div>
      <div id="summary"></div>
    </div>
    <script>
      // A minimal MCP App: initializes, renders the tool input and result,
      // and reports its height.
      let nextId = 1;
      const pending = {};
      const send = (message) => window.parent.postMessage(message, "*");
      const request = (method, params) => {
        const id = nextId++;
        send({ jsonrpc: "2.0", id, method, params });
        return new Promise((resolve) => (pending[id] = resolve));
      };
      const reportSize = () =>
        send({
          jsonrpc: "2.0",
          method: "ui/notifications/size-changed",
          params: {
            width: document.body.scrollWidth,
            height: document.body.scrollHeight,
          },
        });

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && pending[message.id]) {
          pending[message.id](message);
          delete pending[message.id];
          return;
        }
        if (message.method === "ui/notifications/tool-input") {
          document.getElementById("city").textContent =
            message.params.arguments.city;
        }
        if (message.method === "ui/notifications/tool-result") {
          const data = message.params.structuredContent || {};
          document.getElementById("temp").textContent = `${data.temperature}°C`;
          document.getElementById("summary").textContent =
            message.params.content[0].text;
          reportSize();
        }
      });

      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: { name: "weather", version: "1.0.0" },
        appCapabilities: {},
      }).then(() =>
        send({ jsonrpc: "2.0", method: "ui/notifications/initialized" }),
      );
    </script>
  </body>
</html>
