[package]
name = "assistant-mcp-client"
version = "0.1.85"
license.workspace = true
edition.workspace = true
description = "MCP client library — connects to external MCP servers and bridges their tools"

[lib]
name = "assistant_mcp_client"
path = "src/lib.rs"

[dependencies]
assistant-core = { path = "../core" }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
rmcp = { version = "1.3.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
http = "1"
# Must match rmcp's reqwest version (0.13) for StreamableHttpClientTransport type
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
