[package]
name = "assistant-mcp-client"
version = "0.1.156"
license.workspace = true
edition.workspace = true
description = "MCP client library — connects to external MCP servers and bridges their tools"

[lib]
name = "assistant_mcp_client"
path = "src/lib.rs"

[dependencies]
assistant-core = { path = "../core" }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
rmcp = { version = "1.7.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
http = "1"
# Must match rmcp's reqwest version (0.13) for StreamableHttpClientTransport type
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Panic-free contract: production code propagates errors via `anyhow::Result`.
# Tests are exempt because `make lint` (`cargo clippy --workspace`) does not
# check `#[cfg(test)]` modules. Cargo forbids combining `[lints] workspace = true`
# with per-crate overrides, so this crate manually replays the workspace
# baseline and raises the panic-free lints to deny. Keep this block in sync
# with the workspace baseline in the root Cargo.toml.
# See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
