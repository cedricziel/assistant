[package]
name = "opentelemetry-exporter-iceberg"
version = "0.1.87"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Apache Iceberg exporter for OpenTelemetry spans, logs, and metrics"

[dependencies]
# Apache Iceberg
iceberg.workspace = true
iceberg-catalog-rest.workspace = true
# iceberg 0.9 requires arrow/parquet 57.x; pin explicitly until iceberg upgrades
arrow-array = "57"
arrow-schema = "57"
parquet = { version = "57", default-features = false, features = ["arrow", "async"] }
# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Serialization / error handling
serde_json = { workspace = true }
anyhow = { workspace = true }
# Logging
tracing = { workspace = true }
# IDs / time
uuid = { workspace = true }
chrono = { workspace = true }
# Path utilities
dirs = { workspace = true }
# Internal
assistant-core = { path = "../core" }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["async-trait", "futures"]
