[package]
name = "assistant-runtime"
version = "0.1.161"
license.workspace = true
edition.workspace = true
description = "ReAct orchestrator and safety gate for the assistant runtime"

[dependencies]
assistant-core = { path = "../core" }
assistant-llm-provider = { path = "../llm-provider" }
assistant-storage = { path = "../storage" }
opentelemetry-exporter-sqlite = { path = "../opentelemetry-exporter-sqlite" }
opentelemetry-exporter-iceberg = { path = "../opentelemetry-exporter-iceberg" }
assistant-skills = { path = "../skills" }
assistant-tool-executor = { path = "../tool-executor" }
assistant-transcription = { path = "../transcription" }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# cron expression parsing for scheduler
cron = { workspace = true }
# bootstrap helpers
dirs = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

# Panic-free contract: all non-test code in this crate propagates errors
# via `Result<_, anyhow::Error>`, falls back via `std::future::pending()`
# for signal-handler install failures, or compile-time-evaluates its
# invariants. Cargo forbids combining `workspace = true` with per-crate
# overrides, so this manually replays the workspace baseline plus the
# deny ratchet. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
