[package]
name = "assistant-runtime"
version = "0.1.128"
license.workspace = true
edition.workspace = true
description = "ReAct orchestrator and safety gate for the assistant runtime"

[dependencies]
assistant-core = { path = "../core" }
assistant-llm = { path = "../llm" }
assistant-storage = { path = "../storage" }
opentelemetry-exporter-sqlite = { path = "../opentelemetry-exporter-sqlite" }
opentelemetry-exporter-iceberg = { path = "../opentelemetry-exporter-iceberg" }
assistant-skills = { path = "../skills" }
assistant-tool-executor = { path = "../tool-executor" }
assistant-transcription = { path = "../transcription" }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# cron expression parsing for scheduler
cron = { workspace = true }
# bootstrap helpers
dirs = { workspace = true }
toml = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
