[package]
name = "assistant-llm-provider"
version = "0.1.163"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Consolidated LLM provider implementations (Ollama, Anthropic, OpenAI, Moonshot)"

[dependencies]
assistant-core       = { path = "../core" }
async-trait          = { workspace = true }
anyhow               = { workspace = true }
tokio                = { workspace = true }
reqwest              = { workspace = true }
reqwest-middleware    = { workspace = true }
reqwest-retry        = { workspace = true }
reqwest-tracing      = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
tracing              = { workspace = true }
futures              = { workspace = true }
async-openai         = { workspace = true }
chrono               = { workspace = true }
dirs                 = { workspace = true }
base64               = { workspace = true }
sha2                 = { workspace = true }
url                  = { workspace = true }
getrandom            = { workspace = true }

[dev-dependencies]
tempfile             = { workspace = true }
wiremock             = { workspace = true }

# Panic-free contract: all non-test code in this crate propagates errors
# via `Result<_, anyhow::Error>`. Cargo forbids combining `workspace = true`
# with per-crate overrides, so this manually replays the workspace baseline
# plus the deny ratchet. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
