[package]
name = "assistant-mcp-server"
version = "0.3.2"
license.workspace = true
edition.workspace = true
description = "MCP server library exposing assistant tools and skills through rmcp"

[lib]
name = "assistant_mcp_server"
path = "src/lib.rs"

# Spawns itself as a child process to inspect the real stdout and stderr.
[[test]]
name = "stdio"
path = "tests/stdio.rs"
harness = false

[dependencies]
assistant-core = { path = "../core" }
assistant-storage = { path = "../storage" }
assistant-tool-executor = { path = "../tool-executor" }
assistant-runtime = { path = "../runtime" }
assistant-skills = { path = "../skills" }
rmcp = { workspace = true, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
http = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

# Panic-free contract: production code propagates errors via `anyhow::Result`.
# Tests are exempt because `make lint` (`cargo clippy --workspace`) does not
# check `#[cfg(test)]` modules. Cargo forbids combining `[lints] workspace = true`
# with per-crate overrides, so this crate manually replays the workspace
# baseline and raises the panic-free lints to deny. Keep this block in sync
# with the workspace baseline in the root Cargo.toml.
# See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
