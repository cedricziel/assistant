[package]
name = "assistant-tool-executor"
version = "0.1.165"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "assistant_tool_executor"

[dependencies]
assistant-core = { path = "../core" }
assistant-skills = { path = "../skills" }
assistant-storage = { path = "../storage" }
assistant-transcription = { path = "../transcription" }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
glob = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
whatlang = { workspace = true }
stop-words = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

# Panic-free contract: all non-test code in this crate either propagates
# errors via `Result<_, anyhow::Error>` / `ToolOutput::error(...)`, or
# recovers from `std::sync::RwLock` poison explicitly, or gracefully
# degrades when a static `scraper::Selector` somehow fails to parse.
# Cargo forbids combining `workspace = true` with per-crate overrides,
# so this manually replays the workspace baseline plus the deny ratchet.
# See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
