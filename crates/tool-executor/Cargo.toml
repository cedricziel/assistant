[package]
name = "assistant-tool-executor"
version = "0.1.155"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "assistant_tool_executor"

[dependencies]
assistant-core = { path = "../core" }
assistant-skills = { path = "../skills" }
assistant-storage = { path = "../storage" }
assistant-transcription = { path = "../transcription" }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
glob = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
whatlang = { workspace = true }
stop-words = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# TODO(workspace-lint-policy): ratchet by removing the allow overrides below
# once non-test unwrap/expect/panic calls are gone from this crate. The
# workspace baseline (root Cargo.toml [workspace.lints]) is `warn`; we cannot
# combine `workspace = true` with overrides, so this crate manually replays
# the relevant lints. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
