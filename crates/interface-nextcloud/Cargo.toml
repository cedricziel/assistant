[package]
name = "assistant-interface-nextcloud"
version = "0.1.118"
license.workspace = true
edition.workspace = true
description = "Nextcloud Talk webhook-based bot interface for the AI assistant"

[lib]
name = "assistant_interface_nextcloud"
path = "src/lib.rs"

[dependencies]
assistant-core = { path = "../core" }
assistant-runtime = { path = "../runtime" }
assistant-transcription = { path = "../transcription" }

tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }

# HTTP server for receiving webhooks
axum = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
