[package]
name = "assistant-core"
version = "0.1.157"
license.workspace = true
edition.workspace = true
description = "Core types, skill definitions, and shared traits for the assistant workspace"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
# tokio sync primitives (mpsc::Sender in LlmProvider trait)
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Panic-free contract: all non-test code in this crate either propagates
# errors via `Result<_, anyhow::Error>` or recovers from `std::sync::Mutex`
# poison explicitly (in the `InMemory*Store` impls). Cargo forbids combining
# `workspace = true` with per-crate overrides, so this manually replays the
# workspace baseline plus the deny ratchet. See
# openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
