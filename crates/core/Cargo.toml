[package]
name = "assistant-core"
version = "0.1.155"
license.workspace = true
edition.workspace = true
description = "Core types, skill definitions, and shared traits for the assistant workspace"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
# tokio sync primitives (mpsc::Sender in LlmProvider trait)
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# TODO(workspace-lint-policy): ratchet by removing the allow overrides below
# once non-test unwrap/expect/panic calls are gone from this crate. The
# workspace baseline (root Cargo.toml [workspace.lints]) is `warn`; we cannot
# combine `workspace = true` with overrides, so this crate manually replays
# the relevant lints. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
