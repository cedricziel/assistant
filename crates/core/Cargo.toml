[package]
name = "assistant-core"
version = "0.3.1"
license.workspace = true
edition.workspace = true
description = "Core types, skill definitions, and shared traits for the assistant workspace"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
# tokio sync primitives (mpsc::Sender in LlmProvider trait)
tokio = { workspace = true }
# TLS provider install helper (`tls::install_ring`)
rustls = { workspace = true }
ctor = { workspace = true, optional = true }

[features]
# Installs the ring provider before any test `main` runs. Crates whose tests build
# reqwest clients enable it from `[dev-dependencies]`; binaries call `tls::install_ring`.
test-tls = ["dep:ctor"]

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }

# Panic-free contract: all non-test code in this crate either propagates
# errors via `Result<_, anyhow::Error>` or recovers from `std::sync::Mutex`
# poison explicitly (in the `InMemory*Store` impls). Cargo forbids combining
# `workspace = true` with per-crate overrides, so this manually replays the
# workspace baseline plus the deny ratchet. See
# openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
