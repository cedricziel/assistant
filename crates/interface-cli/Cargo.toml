[package]
name = "assistant-cli"
version = "0.1.127"
license.workspace = true
edition.workspace = true
description = "Interactive CLI REPL for the local AI assistant"

[features]
slack = ["dep:assistant-interface-slack"]
mattermost = ["dep:assistant-interface-mattermost"]
matrix = ["dep:assistant-interface-matrix"]
nextcloud = ["dep:assistant-interface-nextcloud"]
signal = ["dep:assistant-interface-signal"]
mcp = ["dep:assistant-mcp-server"]
nats = ["dep:assistant-bus-nats", "assistant-web-ui/nats"]
default = ["slack", "mattermost", "matrix", "nextcloud", "signal", "mcp", "nats"]

[[bin]]
name = "assistant"
path = "src/main.rs"

[lib]
name = "assistant_interface_cli"
path = "src/lib.rs"

[dependencies]
assistant-core = { path = "../core" }
assistant-llm = { path = "../llm" }
assistant-storage = { path = "../storage" }
assistant-provider-ollama = { path = "../provider-ollama" }
assistant-provider-anthropic = { path = "../provider-anthropic" }
assistant-provider-openai = { path = "../provider-openai" }
assistant-provider-moonshot = { path = "../provider-moonshot" }
assistant-skills = { path = "../skills" }
assistant-tool-executor = { path = "../tool-executor" }
assistant-runtime = { path = "../runtime" }
# Optional interface crates (activated by features)
assistant-interface-slack = { path = "../interface-slack", optional = true }
assistant-interface-mattermost = { path = "../interface-mattermost", optional = true }
assistant-interface-matrix = { path = "../interface-matrix", optional = true }
assistant-interface-nextcloud = { path = "../interface-nextcloud", optional = true }
assistant-interface-signal = { path = "../interface-signal", optional = true }
assistant-web-ui = { path = "../web-ui", default-features = false }
assistant-mcp-server = { path = "../mcp-server", optional = true }
assistant-bus-nats = { path = "../bus-nats", optional = true }
assistant-mcp-client = { path = "../mcp-client" }
assistant-transcription = { path = "../transcription" }
assistant-backup = { path = "../backup" }
# CancellationToken for background Nextcloud shutdown
tokio-util = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Terminal line editor
reedline = { workspace = true }
# Config file parsing
toml = { workspace = true }
# Home directory
dirs = { workspace = true }
# Argument parsing
clap = { workspace = true }
# Explicit rustls dep so we can install the ring provider before TLS starts
rustls = { workspace = true }
