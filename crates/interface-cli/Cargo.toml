[package]
name = "assistant-cli"
version = "0.1.157"
license.workspace = true
edition.workspace = true
description = "Interactive CLI REPL for the local AI assistant"

[features]
mcp = ["dep:assistant-mcp-server"]
nats = ["dep:assistant-bus-nats", "assistant-web-ui/nats"]
default = ["mcp", "nats"]

[[bin]]
name = "assistant"
path = "src/main.rs"

[lib]
name = "assistant_interface_cli"
path = "src/lib.rs"

[dependencies]
assistant-core = { path = "../core" }
assistant-storage = { path = "../storage" }
assistant-llm-provider = { path = "../llm-provider" }
assistant-skills = { path = "../skills" }
assistant-tool-executor = { path = "../tool-executor" }
assistant-runtime = { path = "../runtime" }
# Consolidated messenger interfaces (Slack, Mattermost, Matrix, Nextcloud, Signal)
assistant-interfaces = { path = "../interfaces" }
assistant-web-ui = { path = "../web-ui", default-features = false }
assistant-mcp-server = { path = "../mcp-server", optional = true }
assistant-bus-nats = { path = "../bus-nats", optional = true }
assistant-mcp-client = { path = "../mcp-client" }
assistant-transcription = { path = "../transcription" }
assistant-backup = { path = "../backup" }
# CancellationToken for background Nextcloud shutdown
tokio-util = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# Terminal line editor
reedline = { workspace = true }
# TTY-safe password prompt (used by `assistant account change-password`)
rpassword = { workspace = true }
# Config file parsing
toml = { workspace = true }
# Home directory
dirs = { workspace = true }
# Argument parsing
clap = { workspace = true }
# Explicit rustls dep so we can install the ring provider before TLS starts
rustls = { workspace = true }
# SQLite WAL checkpoint during `assistant migrate finalize`
sqlx = { workspace = true }
# Process detection for `assistant migrate finalize`
sysinfo = { workspace = true }
# Unified diff rendering for `/review` skill refinement display.
similar = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Panic-free contract: production code propagates errors via `anyhow::Result`.
# Tests are exempt because `make lint` (`cargo clippy --workspace`) does not
# check `#[cfg(test)]` modules. Cargo forbids combining `[lints] workspace = true`
# with per-crate overrides, so this crate manually replays the workspace
# baseline and raises the panic-free lints to deny. Keep this block in sync
# with the workspace baseline in the root Cargo.toml.
# See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
