[package]
name = "assistant-interfaces"
version = "0.1.155"
edition.workspace = true
license.workspace = true
description = "Consolidated messenger interface adapters (Slack, Mattermost, Matrix, Nextcloud, Signal)"

[lib]
name = "assistant_interfaces"
path = "src/lib.rs"

[dependencies]
# Workspace crates
assistant-core = { path = "../core" }
assistant-runtime = { path = "../runtime" }
assistant-storage = { path = "../storage" }
assistant-transcription = { path = "../transcription" }

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-tungstenite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Async traits
async-trait = { workspace = true }

# IDs and time
uuid = { workspace = true }
chrono = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Async streams
futures = { workspace = true }

# Logging
tracing = { workspace = true }

# Slack-specific: bounded LRU cache for dedup
lru = { workspace = true }

# Matrix-specific: home directory, URL encoding
dirs = { workspace = true }
urlencoding = { workspace = true }

# Nextcloud-specific: webhook HTTP server + HMAC signing
axum = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
tokio-util = { workspace = true }

# Signal-specific: base64 auth, config parsing
base64 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

# TODO(workspace-lint-policy): ratchet by removing the allow overrides below
# once non-test unwrap/expect/panic calls are gone from this crate. The
# workspace baseline (root Cargo.toml [workspace.lints]) is `warn`; we cannot
# combine `workspace = true` with overrides, so this crate manually replays
# the relevant lints. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
