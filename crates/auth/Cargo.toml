[package]
name = "assistant-auth"
version = "0.1.160"
license.workspace = true
edition.workspace = true
description = "Authentication and authorization: OAuth2 server, JWT, password hashing, OIDC, API keys"

[dependencies]
assistant-core = { path = "../core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# IDs and time
uuid = { workspace = true }
chrono = { workspace = true }

# JWT signing and validation
jsonwebtoken = { workspace = true }

# Password hashing (argon2id)
argon2 = { workspace = true }

# Cryptographic randomness
rand = { workspace = true }

# Hashing (PKCE S256, auth code storage, API key SHA-256)
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# URL parsing (redirect URI validation)
url = { workspace = true }

# Async runtime (for token store traits)
tokio = { workspace = true }
async-trait = { workspace = true }

# HTTP client (OIDC discovery, JWKS fetch)
reqwest = { workspace = true }

# Logging
tracing = { workspace = true }

# URL percent-encoding (OIDC authorize URL)
urlencoding = { workspace = true }

# HTTP server (middleware extractors)
axum = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }

# Panic-free contract: all non-test code in this crate propagates errors
# via `Result<_, anyhow::Error>` or recovers from `std::sync::Mutex` poison
# explicitly. Cargo forbids combining `workspace = true` with per-crate
# overrides, so this manually replays the workspace baseline plus the deny
# ratchet. See openspec/changes/workspace-lint-policy/.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "warn"
todo = "warn"

[lints.rust]
unused_must_use = "deny"
