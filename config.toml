# Default configuration for the AI assistant
# Copy to ~/.assistant/config.toml and customize

[llm]
# LLM backend provider.  Options: "ollama" (default, local), "anthropic" (cloud), "openai" (cloud).
provider = "ollama"
# Model to use for inference.
# Ollama models — requires native tool-calling support. Recommended choices (2026):
#
#   ≤ 8 GB VRAM  — qwen2.5:7b (default), llama3.1:8b, mistral:7b-instruct-v0.3
#   ≤ 12 GB VRAM — qwen2.5:14b (recommended upgrade), deepseek-r1:14b, phi4:14b
#   ≤ 24 GB VRAM — qwen2.5:32b
#
# Use Q4_K_M quantization for 14 B+ models.
model = "qwen2.5:7b"
# Ollama API base URL
base_url = "http://localhost:11434"
# Maximum tool-calling iterations per turn
max_iterations = 80
# Timeout for LLM calls (seconds)
timeout_secs = 120

# ── Anthropic cloud provider ──────────────────────────────────────────────────
# To use Claude instead of a local Ollama model, replace the [llm] block above
# with (or uncomment) the following:
#
# [llm]
# provider  = "anthropic"
# model     = "claude-opus-4-6"     # or claude-sonnet-4-6, claude-haiku-4-5-20251001
# api_key   = "sk-ant-..."          # or set ANTHROPIC_API_KEY env var
# max_iterations = 80
# timeout_secs   = 120
#
# # Optional: enable Anthropic's hosted web search tool
# [llm.anthropic.web_search]
# enabled = true           # enabled by default; set to false to disable
# max_uses = 3
# allowed_domains = ["example.com"]
# blocked_domains = []
#
# [llm.anthropic.web_search.user_location]
# type = "approximate"
# city = "San Francisco"
# region = "California"
# country = "US"
# timezone = "America/Los_Angeles"
#
# # Optional: enable Anthropic's hosted web fetch tool
# [llm.anthropic.web_fetch]
# enabled = true           # enabled by default; set to false to disable
# max_uses = 10
# max_content_tokens = 100000
# allowed_domains = []
# blocked_domains = []
# citations.enabled = true

# ── Dedicated embedding provider ──────────────────────────────────────────────
# Ollama and OpenAI support embeddings natively — no extra config needed.
# For Anthropic (which has no built-in embeddings), or when you want a
# specialised embedding model, add an [llm.embeddings] section.
#
# Supported providers: "ollama", "openai", "voyage"
# API keys fall back to env vars: OPENAI_API_KEY, VOYAGE_API_KEY
#
# Voyage AI (recommended by Anthropic):
# [llm.embeddings]
# provider = "voyage"
# model    = "voyage-3-lite"          # default; also voyage-3, voyage-3-large
# # api_key = "pa-..."               # or set VOYAGE_API_KEY env var
#
# Ollama (use your local server for embeddings while chatting via Anthropic):
# [llm.embeddings]
# provider = "ollama"
# model    = "nomic-embed-text"       # default
# base_url = "http://localhost:11434"
#
# OpenAI:
# [llm.embeddings]
# provider = "openai"
# model    = "text-embedding-3-small" # default; also text-embedding-3-large
# # api_key = "sk-..."               # or set OPENAI_API_KEY env var

# ── OpenAI cloud provider ─────────────────────────────────────────────────────
# To use OpenAI instead of a local Ollama model, replace the [llm] block above
# with (or uncomment) the following:
#
# [llm]
# provider        = "openai"
# model           = "gpt-4o"          # or gpt-4.1, gpt-4o-mini, o3-mini, o3
# api_key         = "sk-..."          # or set OPENAI_API_KEY env var
# max_iterations  = 80
# timeout_secs    = 120
# embedding_model = "text-embedding-3-small"
#
# [llm.openai]
# max_tokens = 8192                   # max_completion_tokens per response
#
# # Hosted web search (requires gpt-4o-search-preview, gpt-4o-mini-search-preview,
# # or gpt-5-search-api model):
# # [llm.openai.web_search]
# # enabled             = true
# # search_context_size = "medium"     # "low", "medium" (default), or "high"
# # [llm.openai.web_search.user_location]
# # country  = "US"
# # city     = "San Francisco"
# # region   = "California"
# # timezone = "America/Los_Angeles"
#
# # Alternative: OAuth PKCE mode for Codex subscriptions (billed against
# # your ChatGPT plan quota instead of API credits).
# # [llm.openai]
# # auth_mode       = "oauth"
# # oauth_client_id = "your-client-id"
# # max_tokens      = 8192
#
# The base_url setting also works with OpenAI-compatible APIs:
# base_url = "https://openrouter.ai/api/v1"        # OpenRouter
# base_url = "http://localhost:8000/v1"             # vLLM / LM Studio
# See docs/openai.md for full details.

# ── Moonshot AI (Kimi) cloud provider ─────────────────────────────────────────
# To use Moonshot AI instead of a local Ollama model, replace the [llm] block
# above with (or uncomment) the following:
#
# [llm]
# provider        = "moonshot"
# model           = "kimi-k2.6"       # or kimi-k2.6-thinking, kimi-k2.5, kimi-latest
# api_key         = "sk-..."          # or set MOONSHOT_API_KEY env var
# max_iterations  = 80
# timeout_secs    = 120
#
# # Use the China endpoint instead of global:
# # base_url = "https://api.moonshot.cn/v1"
#
# [llm.moonshot]
# max_tokens = 8192                   # max completion tokens per response
#
# # Hosted web search ($web_search builtin — server-side, no extra cost):
# # [llm.moonshot.web_search]
# # enabled = true

[storage]
# Path to SQLite database (~/.assistant/assistant.db by default)
# db_path = "~/.assistant/assistant.db"

[agent]
# Active assistant context ID. Each agent gets its own memory/workspace root at
# ~/.assistant/agents/<id>/ while sharing the same SQLite database.
# id = "default"

# [bus]
# Message bus backend.  Options: "sqlite" (default), "nats".
# NATS JetStream eliminates SQLite write-lock contention when the
# orchestrator, OTel exporters, and bus all share a single SQLite pool.
# Requires the `nats` feature to be compiled in.
# kind = "nats"
# nats_url = "nats://localhost:4222"   # or set NATS_URL env var
#
# Authentication (pick one, all fields fall back to env vars):
# username = "myuser"                  # or NATS_USER
# password = "s3cret"                  # or NATS_PASSWORD
# token = "t0k3n!"                    # or NATS_TOKEN
# credentials_file = "/path/to/nats.creds"  # or NATS_CREDENTIALS_FILE

[skills]
# Directories to scan for skills (highest priority first):
# 1. entries from extra_dirs (defaults target Claude Code/NanoClaw folders)
# 2. ~/.assistant/skills/ (user personal)
# 3. <project>/.assistant/skills/ (project-scoped, auto-detected)
# 4. <binary dir>/skills/ (built-in sidecar, optional)

# Extra skill directories to include.  Paths may be absolute, use ~/ for home,
# or be relative to the current project directory.  By default the assistant
# also scans ~/.claude/skills and ./.claude/skills so Claude Code / NanoClaw
# skills are picked up automatically.
# extra_dirs = ["~/.claude/skills", "./.claude/skills"]

[mcp]

# ── External MCP servers (client connections) ─────────────────────────────────
# Connect to external MCP servers and bridge their tools into the assistant.
# Tools are namespaced as mcp__{name}__{tool_name} to avoid collisions.
#
# Stdio transport — spawns a local subprocess:
# [[mcp.servers]]
# name = "github"
# command = ["npx", "-y", "@modelcontextprotocol/server-github"]
# trust = "confirm"            # "confirm" (default) or "trust"
# [mcp.servers.env]
# GITHUB_TOKEN = "${GITHUB_TOKEN}"
#
# [[mcp.servers]]
# name = "filesystem"
# command = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/home/user/docs"]
# trust = "trust"              # read-only server, skip confirmation
#
# HTTP/SSE transport — connect to a remote server:
# [[mcp.servers]]
# name = "remote-db"
# url = "https://db.example.com/mcp/sse"
# [mcp.servers.headers]
# Authorization = "Bearer ${DB_TOKEN}"

[self_improvement]
# Enable passive execution trace collection
trace_enabled = true
# Record full message content on LLM spans (system prompt, input messages,
# output messages, tool definitions).  Off by default — content may contain PII.
# trace_content = false

[memory]
# Persistent markdown memory files.
# When enabled, AGENTS.md / SOUL.md / IDENTITY.md / USER.md / TOOLS.md /
# MEMORY.md are read at the start of every turn and injected as the system
# prompt. Defaults are written to ~/.assistant/agents/default/ on first run.

# enabled = true
# agents_path = "~/.assistant/agents/default/AGENTS.md"
# soul_path = "~/.assistant/agents/default/SOUL.md"
# identity_path = "~/.assistant/agents/default/IDENTITY.md"
# user_path = "~/.assistant/agents/default/USER.md"
# tools_path = "~/.assistant/agents/default/TOOLS.md"
# memory_path = "~/.assistant/agents/default/MEMORY.md"
# notes_dir = "~/.assistant/agents/default/memory"
# bootstrap_path = "~/.assistant/agents/default/BOOTSTRAP.md"
# heartbeat_path = "~/.assistant/agents/default/HEARTBEAT.md"
# boot_path = "~/.assistant/agents/default/BOOT.md"

# ── Transcription (speech-to-text) ────────────────────────────────────────────
# Providers: "whisper" (OpenAI), "ollama" (local), "deepgram"
# API keys fall back to env vars: OPENAI_API_KEY, DEEPGRAM_API_KEY
#
# [transcription]
# provider = "whisper"
# model    = "whisper-1"                # provider-specific default if omitted
# # api_key = "sk-..."                 # or set OPENAI_API_KEY env var
# # base_url = "https://api.openai.com/v1"
# # language = "en"                    # optional BCP-47 language hint

# ── Text-to-speech (TTS) ─────────────────────────────────────────────────────
# Providers: "openai", "deepgram"
# API keys fall back to env vars: OPENAI_API_KEY, DEEPGRAM_API_KEY
#
# [tts]
# provider = "deepgram"
# model    = "aura-2-thalia-en"         # provider-specific default if omitted
# # voice  = "nova"                    # voice name (OpenAI); ignored by Deepgram auto-detect
# # api_key = "sk-..."                 # or set DEEPGRAM_API_KEY / OPENAI_API_KEY env var
# # base_url = "https://api.deepgram.com/v1"
#
# Per-language voice overrides (Deepgram only).
# When no explicit voice is set, Deepgram auto-detects the language of each
# TTS request and selects a matching Aura 2 voice.  Override defaults here:
#
# [tts.voices]
# en = "aura-2-thalia-en"              # English  (default)
# de = "aura-2-julius-de"              # German   (default)
# es = "aura-2-lucia-es"               # Spanish  (default)
# fr = "aura-2-chloe-fr"              # French   (default)

# ── Autonomous Learning ───────────────────────────────────────────────────────
# The agent creates skills from complex tasks and periodically improves them.
[learning]
enabled = true                          # master switch (default: true)
auto_create_skills = true               # generate skills from novel tasks
auto_apply_refinements = true           # apply improvements without /review
min_tool_calls_for_skill = 3            # minimum tool calls to consider skill creation
min_executions_for_analysis = 10        # minimum traces before self-analysis
improvement_cron = "0 */6 * * *"        # run improvement cycle every 6 hours
error_rate_threshold = 0.2              # trigger improvement above 20% error rate
revert_window = 5                       # executions to evaluate after refinement
revert_regression_threshold = 0.1       # revert if error rate increases by >10pp

[signal]
# Signal interface settings — requires a running signal-cli-rest-api daemon.
# See: https://github.com/bbernhard/signal-cli-rest-api
# phone_number = "+1234567890"      # Bot's registered Signal number (required)
# api_url = "http://localhost:8080" # signal-cli-rest-api base URL (default)
# api_user = ""                     # HTTP Basic Auth username (optional)
# api_password = ""                 # HTTP Basic Auth password (optional)
# allowed_senders = []              # If set, only these numbers can interact with the bot
