[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # zip 3.0.0 via utoipa-swagger-ui (build-dependency only). Added 2026-11-25.
    { id = "RUSTSEC-2026-0367", reason = "Build-time only: zip extracts the pinned swagger-ui archive. Needs zip >= 9 in utoipa-swagger-ui." },
    { id = "RUSTSEC-2026-0368", reason = "Build-time only: zip extracts the pinned swagger-ui archive. Needs zip >= 9 in utoipa-swagger-ui." },
    { id = "RUSTSEC-2026-0369", reason = "Build-time only: zip extracts the pinned swagger-ui archive. Needs zip >= 9 in utoipa-swagger-ui." },
    { id = "RUSTSEC-2026-0429", reason = "Build-time only: zip extracts the pinned swagger-ui archive. Needs zip >= 9 in utoipa-swagger-ui." },
    { id = "RUSTSEC-2026-0545", reason = "Build-time only: zip extracts the pinned swagger-ui archive. Needs zip >= 9 in utoipa-swagger-ui." },
    { id = "RUSTSEC-2026-0548", reason = "Build-time only: zip extracts the pinned swagger-ui archive. Needs zip >= 9 in utoipa-swagger-ui." },
    # Added 2026-11-25.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 comes from p256/elliptic-curve 0.13 (web-ui); the fix (>= 0.7.6) needs the RustCrypto 0.14 generation. Revisit when p256 releases it." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 is pinned by sqlx 0.9; the fix (>= 0.39) needs a newer sqlx. Revisit on the next sqlx release." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained but has no patched release and is used throughout the tree (sqlx, utoipa, serde schemas). No drop-in replacement." },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# One crypto backend: ring. aws-lc-rs/aws-lc-sys compile a C library through
# cmake. Configure the offending crate with its ring (or no-provider) feature.
deny = [
    { crate = "aws-lc-rs", reason = "ring is the only crypto backend" },
    { crate = "aws-lc-sys", reason = "ring is the only crypto backend" },
    { crate = "cmake", reason = "only needed to build aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses.private]
ignore = true
